[package]
name = "fastauth-compat-better-auth-dual"
description = "The fastauth side of the Better Auth cross-app suite (tests/compat/better-auth-dual)."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
fastauth = { path = "../../../../crates/fastauth", features = [
    "cli",
    "oauth",
    "magic-link",
    "email-otp",
    "admin",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.45", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"
