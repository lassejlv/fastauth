[workspace]
resolver = "3"
members = [
    "crates/fastauth",
    "crates/core",
    "crates/macros",
    "crates/axum",
    "crates/actix",
    "crates/sqlx",
    "crates/redis",
    "crates/oauth",
    "crates/cli",
    "crates/plugins/*",
    "examples/fullstack/server",
    "tests/compat/better-auth-dual/fastauth",
]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/lassejlv/fastauth"
keywords = ["auth", "authentication", "axum", "sqlx", "session"]
categories = ["authentication", "web-programming"]

# Password hashing with production parameters is far too slow unoptimized, in tests too.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
