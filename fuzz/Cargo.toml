[package]
name = "fastauth-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: the root workspace (crates/*) never builds or publishes it.
[workspace]
members = ["."]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
aws-lc-rs = "1"
bytes = "1"
fastauth-core = { path = "../crates/core" }
fastauth-oauth = { path = "../crates/oauth" }
fastauth-plugin-admin = { path = "../crates/plugins/admin" }
fastauth-plugin-api-key = { path = "../crates/plugins/api-key" }
fastauth-plugin-bearer = { path = "../crates/plugins/bearer" }
fastauth-plugin-email-otp = { path = "../crates/plugins/email-otp" }
fastauth-plugin-jwt = { path = "../crates/plugins/jwt" }
fastauth-plugin-magic-link = { path = "../crates/plugins/magic-link" }
fastauth-plugin-multi-session = { path = "../crates/plugins/multi-session" }
fastauth-plugin-organization = { path = "../crates/plugins/organization" }
fastauth-plugin-passkey = { path = "../crates/plugins/passkey" }
fastauth-plugin-two-factor = { path = "../crates/plugins/two-factor" }
fastauth-plugin-username = { path = "../crates/plugins/username" }
fastauth-sqlx = { path = "../crates/sqlx", default-features = false, features = ["sqlite"] }
hkdf = "0.13"
hmac = "0.13"
http = "1"
libfuzzer-sys = "0.4"
percent-encoding = "2"
serde_cbor_2 = "0.13"
serde_json = "1"
sha2 = "0.11"
time = "0.3"
tokio = { version = "1", features = ["rt"] }
url = "2"

[[bin]]
name = "signed_cookie"
path = "fuzz_targets/signed_cookie.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bearer_token"
path = "fuzz_targets/bearer_token.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jwt_header"
path = "fuzz_targets/jwt_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "json_body"
path = "fuzz_targets/json_body.rs"
