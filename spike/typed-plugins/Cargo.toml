[package]
name = "fastauth-spike-typed-plugins"
version = "0.0.0"
edition = "2024"
publish = false
description = "Throwaway spike proving the fastauth type-level plugin API compiles and infers."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
