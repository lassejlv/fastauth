[package]
name = "fastauth-example-fullstack"
description = "The fullstack example app: axum, Postgres and a React client on Better Auth's client."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "fastauth"
path = "src/bin/fastauth.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
dotenvy = "0.15.7"
fastauth = { path = "../../../crates/fastauth", features = [
    "cli",
    "oauth",
    "two-factor",
    "passkey",
    "organization",
    "admin",
    "api-key",
    "redis",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "time",
] }
time = { version = "0.3.45", features = ["serde-well-known"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.11", features = ["fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
