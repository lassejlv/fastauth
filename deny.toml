# cargo-deny: `cargo deny check licenses advisories` (scripts/ci.sh runs it).

[graph]
all-features = true

[advisories]
# RustSec advisories for every crate in the graph. A vulnerability fails the check; ignore one
# only with its id and a reason.
ignore = []

[licenses]
# MIT and the licences that can be combined with it in an MIT-licensed library.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

# The passkey plugin builds on webauthn-rs, which is MPL-2.0 (file-level copyleft; using it
# unmodified from an MIT crate is fine). Allowed for those crates only.
exceptions = [
    { allow = ["MPL-2.0"], crate = "webauthn-rs" },
    { allow = ["MPL-2.0"], crate = "webauthn-rs-core" },
    { allow = ["MPL-2.0"], crate = "webauthn-rs-proto" },
    { allow = ["MPL-2.0"], crate = "webauthn-attestation-ca" },
    { allow = ["MPL-2.0"], crate = "crypto-glue" },
]
