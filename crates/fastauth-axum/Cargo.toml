[package]
name = "fastauth-axum"
description = "axum integration for fastauth: the auth router, session extractors and a session layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["original-uri", "tokio"] }
bytes = "1.12.2"
fastauth-core = { version = "0.4.0", path = "../fastauth-core", features = ["axum"] }
http = "1.5.0"
http-body = "1.0.1"
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["sync"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"

[dev-dependencies]
axum = { version = "0.8.9", features = ["macros"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
