[package]
name = "fastauth-redis"
description = "Redis and Valkey secondary storage for fastauth, so rate limits hold across every instance of an app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["auth", "redis", "valkey", "rate-limit", "session"]
categories.workspace = true
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
## `rediss://` URLs: TLS with rustls and the platform's root certificates.
tls = ["redis/tokio-rustls-comp", "dep:rustls"]

[dependencies]
fastauth-core = { version = "0.8.0", path = "../core" }
redis = { version = "1.8.3", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }
# Only to pick ring as rustls's crypto provider, which redis leaves to the app.
rustls = { version = "0.23.46", default-features = false, features = ["ring"], optional = true }

[dev-dependencies]
bytes = "1.12.2"
fastauth-core = { path = "../core", features = ["testing"] }
fastauth-plugin-admin = { path = "../plugins/admin" }
fastauth-sqlx = { path = "../sqlx", default-features = false, features = ["postgres"] }
http = "1.5.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
