[package]
name = "fastauth-sqlx"
description = "sqlx adapter for fastauth: Postgres, SQLite and MySQL, with migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
mysql = ["sqlx/mysql"]
## TLS for database connections through rustls (sqlx's `tls-rustls`), with webpki roots.
tls-rustls = ["sqlx/tls-rustls"]

[dependencies]
fastauth-core = { version = "0.8.0", path = "../fastauth-core" }
serde_json = "1.0.154"
sqlx-core = { version = "0.9.1", default-features = false }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "json", "time", "uuid"] }
time = "0.3.45"
tokio = { version = "1.54.1", features = ["sync"] }

[[test]]
name = "mysql"
required-features = ["mysql"]

[[test]]
name = "properties_ids"
required-features = ["mysql"]

[[test]]
name = "security_fast46"
required-features = ["mysql"]

[dev-dependencies]
bytes = "1.12.2"
fastauth-core = { path = "../fastauth-core", features = ["testing"] }
http = "1.5.0"
proptest = "1.12.0"
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["mysql-rsa"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = "1.26.1"
