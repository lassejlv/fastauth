[package]
name = "fastauth-sqlx"
description = "sqlx adapter for fastauth: Postgres and SQLite, with migrations."
version.workspace = true
edition.workspace = true
# sqlx 0.9 needs Rust 1.94; the rest of the workspace stays at 1.88.
rust-version = "1.94"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[dependencies]
fastauth-core = { path = "../fastauth-core" }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "json", "time", "uuid"] }
time = "0.3.45"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
bytes = "1.12.2"
fastauth-core = { path = "../fastauth-core", features = ["testing"] }
http = "1.5.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
