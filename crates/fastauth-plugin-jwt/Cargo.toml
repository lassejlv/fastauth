[package]
name = "fastauth-plugin-jwt"
description = "JWTs for fastauth: a /token endpoint, a JWKS with rotating keys encrypted at rest, and a verifier for resource servers, wire-compatible with Better Auth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
aws-lc-rs = "1.19.0"
fastauth-core = { version = "0.4.0", path = "../fastauth-core", features = ["macros"] }
http = "1.5.0"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
pem = "4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.45", features = ["serde"] }

[dev-dependencies]
axum = "0.8.9"
bytes = "1.12.2"
fastauth-axum = { version = "0.4.0", path = "../fastauth-axum" }
fastauth-plugin-bearer = { version = "0.4.0", path = "../fastauth-plugin-bearer" }
fastauth-sqlx = { version = "0.4.0", path = "../fastauth-sqlx", default-features = false, features = ["sqlite", "postgres"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
