[package]
name = "fastauth"
description = "Authentication for Rust web apps, modelled on Better Auth: sessions, email and password, plugins checked by the compiler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[features]
default = ["axum", "postgres", "macros"]
axum = [
    "dep:fastauth-axum",
    "fastauth-core/axum",
    "fastauth-plugin-organization?/axum",
    "fastauth-plugin-admin?/axum",
]
actix = [
    "dep:fastauth-actix",
    "fastauth-core/actix",
    "fastauth-plugin-organization?/actix",
    "fastauth-plugin-admin?/actix",
]
macros = ["fastauth-core/macros"]
postgres = ["dep:fastauth-sqlx", "fastauth-sqlx/postgres"]
sqlite = ["dep:fastauth-sqlx", "fastauth-sqlx/sqlite"]
oauth = ["dep:fastauth-oauth", "fastauth-oauth/reqwest"]
two-factor = ["dep:fastauth-plugin-two-factor"]
organization = ["dep:fastauth-plugin-organization"]
admin = ["dep:fastauth-plugin-admin"]
api-key = ["dep:fastauth-plugin-api-key"]
magic-link = ["dep:fastauth-plugin-magic-link"]
email-otp = ["dep:fastauth-plugin-email-otp"]
bearer = ["dep:fastauth-plugin-bearer"]
jwt = ["dep:fastauth-plugin-jwt"]
passkey = ["dep:fastauth-plugin-passkey"]
username = ["dep:fastauth-plugin-username"]
anonymous = ["dep:fastauth-plugin-anonymous"]
multi-session = ["dep:fastauth-plugin-multi-session"]
cli = ["dep:anyhow", "dep:clap", "dep:dotenvy", "dep:fastauth-sqlx", "dep:time"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.10", features = ["derive", "env"], optional = true }
dotenvy = { version = "0.15.7", optional = true }
fastauth-actix = { version = "0.4.0", path = "../fastauth-actix", optional = true }
fastauth-axum = { version = "0.4.0", path = "../fastauth-axum", optional = true }
fastauth-core = { version = "0.4.0", path = "../fastauth-core" }
fastauth-oauth = { version = "0.4.0", path = "../fastauth-oauth", default-features = false, optional = true }
fastauth-plugin-admin = { version = "0.4.0", path = "../fastauth-plugin-admin", optional = true }
fastauth-plugin-anonymous = { version = "0.4.0", path = "../fastauth-plugin-anonymous", optional = true }
fastauth-plugin-api-key = { version = "0.4.0", path = "../fastauth-plugin-api-key", optional = true }
fastauth-plugin-email-otp = { version = "0.4.0", path = "../fastauth-plugin-email-otp", optional = true }
fastauth-plugin-magic-link = { version = "0.4.0", path = "../fastauth-plugin-magic-link", optional = true }
fastauth-plugin-multi-session = { version = "0.4.0", path = "../fastauth-plugin-multi-session", optional = true }
fastauth-plugin-bearer = { version = "0.4.0", path = "../fastauth-plugin-bearer", optional = true }
fastauth-plugin-jwt = { version = "0.4.0", path = "../fastauth-plugin-jwt", optional = true }
fastauth-plugin-passkey = { version = "0.4.0", path = "../fastauth-plugin-passkey", optional = true }
fastauth-plugin-organization = { version = "0.4.0", path = "../fastauth-plugin-organization", optional = true }
fastauth-plugin-two-factor = { version = "0.4.0", path = "../fastauth-plugin-two-factor", optional = true }
fastauth-plugin-username = { version = "0.4.0", path = "../fastauth-plugin-username", optional = true }
fastauth-sqlx = { version = "0.4.0", path = "../fastauth-sqlx", default-features = false, optional = true }
time = { version = "0.3.45", features = ["formatting", "macros"], optional = true }

[dev-dependencies]
actix-web = { version = "4.20.0", default-features = false, features = ["macros"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
tracing-subscriber = "0.3.23"

[[example]]
name = "axum_memory"
required-features = ["axum"]

[[example]]
name = "axum_sqlite"
required-features = ["axum", "sqlite", "macros", "two-factor", "organization", "admin", "api-key"]

[[example]]
name = "actix_sqlite"
required-features = ["actix", "sqlite", "macros", "two-factor", "organization", "admin", "api-key"]

[[example]]
name = "cli_sqlite"
required-features = ["cli", "sqlite", "macros", "two-factor"]

[[test]]
name = "cli"
required-features = ["cli", "sqlite", "macros"]
