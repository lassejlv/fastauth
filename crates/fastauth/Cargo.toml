[package]
name = "fastauth"
description = "Authentication for Rust web apps, modelled on Better Auth: sessions, email and password, plugins checked by the compiler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[features]
default = ["axum", "postgres", "macros"]
axum = ["dep:fastauth-axum", "fastauth-core/axum"]
macros = ["fastauth-core/macros"]
postgres = ["dep:fastauth-sqlx", "fastauth-sqlx/postgres"]
sqlite = ["dep:fastauth-sqlx", "fastauth-sqlx/sqlite"]
oauth = ["dep:fastauth-oauth", "fastauth-oauth/reqwest"]
two-factor = ["dep:fastauth-plugin-two-factor"]
cli = ["dep:anyhow", "dep:clap", "dep:dotenvy", "dep:fastauth-sqlx", "dep:time"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.10", features = ["derive", "env"], optional = true }
dotenvy = { version = "0.15.7", optional = true }
fastauth-axum = { version = "0.1.0", path = "../fastauth-axum", optional = true }
fastauth-core = { version = "0.1.0", path = "../fastauth-core" }
fastauth-oauth = { version = "0.1.0", path = "../fastauth-oauth", default-features = false, optional = true }
fastauth-plugin-two-factor = { version = "0.1.0", path = "../fastauth-plugin-two-factor", optional = true }
fastauth-sqlx = { version = "0.1.0", path = "../fastauth-sqlx", default-features = false, optional = true }
time = { version = "0.3.45", features = ["formatting", "macros"], optional = true }

[dev-dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
tracing-subscriber = "0.3.23"

[[example]]
name = "axum_memory"
required-features = ["axum"]

[[example]]
name = "axum_sqlite"
required-features = ["axum", "sqlite", "macros", "two-factor"]

[[example]]
name = "cli_sqlite"
required-features = ["cli", "sqlite", "macros", "two-factor"]

[[test]]
name = "cli"
required-features = ["cli", "sqlite", "macros"]
