[package]
name = "fastauth-oauth"
description = "Social sign-in for fastauth: the Social plugin, OAuth providers and the outgoing HTTP client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest"]

[dependencies]
bytes = "1.12.2"
fastauth-core = { version = "0.6.0", path = "../fastauth-core" }
http = "1.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["time"] }
tracing = "0.1.44"
url = "2.5.9"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = "0.3.23"
