[package]
name = "fastauth-actix"
description = "actix-web integration for fastauth: the auth scope, session extractors and a session middleware."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["auth", "authentication", "actix", "sqlx", "session"]
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
actix-web = { version = "4.20.0", default-features = false }
bytes = "1.12.2"
fastauth-core = { version = "0.8.0", path = "../core", features = ["actix"] }
http = "1.5.0"
tokio = { version = "1.54.1", features = ["sync"] }

[dev-dependencies]
actix-http = { version = "3.22.1", default-features = false }
actix-web = { version = "4.20.0", default-features = false, features = ["macros"] }
fastauth-plugin-api-key = { path = "../plugins/api-key" }
fastauth-plugin-bearer = { path = "../plugins/bearer" }
fastauth-plugin-two-factor = { path = "../plugins/two-factor" }
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1.0.154"
