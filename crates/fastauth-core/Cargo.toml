[package]
name = "fastauth-core"
description = "Core of fastauth: the builder, plugin system, sessions, crypto and routing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[features]
axum = ["dep:axum-core"]
## `AuthError` as an actix-web `ResponseError` and `ApiResponse` as a `Responder`.
actix = ["dep:actix-web"]
## `#[derive(Fields)]`, `#[derive(Model)]` and `#[derive(AuthError)]`, re-exported next to their traits.
macros = ["dep:fastauth-macros"]
# The adapter conformance suite: `testing::run_adapter_conformance`.
testing = []

[dependencies]
actix-web = { version = "4.20.0", default-features = false, optional = true }
axum-core = { version = "0.5.6", optional = true }
argon2 = { version = "0.6.0", features = ["getrandom"] }
base64 = "0.23.1"
bytes = "1.12.2"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom"] }
fastauth-macros = { version = "0.8.0", path = "../fastauth-macros", optional = true }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
http = "1.5.0"
matchit = "0.9.2"
percent-encoding = "2.3.2"
scrypt = { version = "0.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
unicode-normalization = "0.1.26"
url = "2.5.9"
uuid = { version = "1.26.1", features = ["v4", "v7"] }
zeroize = "1.9.2"

[dev-dependencies]
fastauth-core = { path = ".", features = ["testing"] }
hkdf = "0.13.0"
hmac = "0.13.0"
proptest = "1.12.0"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
