[package]
name = "fastauth-plugin-username"
description = "Username sign-in for fastauth, wire-compatible with Better Auth's username plugin."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
fastauth-core = { version = "0.7.0", path = "../fastauth-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
axum = "0.8.9"
bytes = "1.12.2"
fastauth-axum = { path = "../fastauth-axum" }
fastauth-sqlx = { path = "../fastauth-sqlx", default-features = false, features = ["sqlite", "postgres", "mysql"] }
sqlx = { version = "0.9.1", default-features = false, features = ["mysql-rsa"] }
http = "1.5.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
