[package]
name = "fastauth-plugin-two-factor"
description = "Two-factor authentication for fastauth: TOTP, email codes, backup codes and trusted devices."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
fastauth-core = { version = "0.7.0", path = "../fastauth-core" }
hmac = "0.13.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"

[dev-dependencies]
fastauth-sqlx = { path = "../fastauth-sqlx", default-features = false, features = ["sqlite", "mysql"] }
sqlx = { version = "0.9.1", default-features = false, features = ["mysql-rsa"] }
bytes = "1.12.2"
http = "1.5.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
